seeds:
  world_seed:
    caches: [world_cache]
    grids: [webmercator]
    levels: [13]

  hr_orthophoto_seed:
    caches: [hr_orthophoto_cache]
    grids: [webmercator]
    coverages: [croatia]
    levels:
      from: 17
      to: 18
    # Only re-fetch tiles missing or older than this — lets a re-run resume
    # instead of re-hammering DGU for everything already cached from the
    # last attempt. Bump this up if you wait longer than a day to retry.
    refresh_before:
      hours: 24

coverages:
  croatia:
    bbox: [15.96, 42.87, 17.23, 43.63]
    srs: 'EPSG:4326'

